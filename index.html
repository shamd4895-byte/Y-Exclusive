<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X Exclusive</title>
  
  <meta name="description" content="X Exclusive - Discover verified elite profiles, connect, call and chat in a luxury private network.">
  <meta name="theme-color" content="#140508">
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/webp" href="images/logo.webp">
</head>
<body data-theme="rose-red">
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <!-- Header Bar -->
  <header class="site-header" id="mainHeader">
    <div class="header-container">
      
      <!-- Logo Branding -->
      <a href="#" class="brand-logo" id="logoLink">
        <img src="images/logo.webp" alt="X Exclusive" class="brand-logo-img" width="38" height="38">
        <span class="brand-name" id="brandTitle">X Exclusive</span>
      </a>

      <!-- Header Controls: Online Badge + Menu + Language -->
      <div class="header-actions">
        <!-- Live Online Counter Badge -->
        <div class="online-status-badge" id="onlineBadge">
          <span class="status-pulse-dot"></span>
          <span class="online-number" id="onlineCountText">056</span>
          <span class="online-label" id="onlineLabel">Online</span>
        </div>

        <!-- Hamburger Menu Button -->
        <button class="icon-btn menu-toggle-btn" id="menuToggleBtn" aria-label="Toggle Navigation Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Language Selector Button -->
        <div class="lang-selector-wrap">
          <button class="icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Change Language">
            <span class="lang-icon-char">文</span>
            <span class="current-lang-code" id="currentLangCode">EN</span>
          </button>

          <!-- Dropdown: Language Picker -->
          <div class="lang-dropdown" id="langDropdown" aria-hidden="true">
            <div class="lang-option active" data-lang="en" id="langOptEn">
              <span class="lang-name-primary">English</span>
              <span class="lang-name-native">English</span>
            </div>
            <div class="lang-option" data-lang="ja" id="langOptJa">
              <span class="lang-name-primary">日本語</span>
              <span class="lang-name-native">日本語</span>
            </div>
            <div class="lang-option" data-lang="id" id="langOptId">
              <span class="lang-name-primary">Indonesia</span>
              <span class="lang-name-native">Bahasa Indonesia</span>
            </div>
            <div class="lang-option" data-lang="fil" id="langOptFil">
              <span class="lang-name-primary">Philippines</span>
              <span class="lang-name-native">Filipino</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Dropdown: Navigation Menu -->
    <nav class="nav-dropdown" id="navDropdown" aria-hidden="true">
      <ul class="nav-links-list">
        <li class="nav-item">
          <a href="#" class="nav-link active" id="navHome">Home</a>
        </li>
        <li class="nav-divider"></li>
        <li class="nav-item">
          <a href="#profiles" class="nav-link" id="navProfiles">Profiles</a>
        </li>
        <li class="nav-divider"></li>
        <li class="nav-item">
          <a href="#" class="nav-link" id="navVip">VIP Club</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Backdrop for open dropdowns -->
  <div class="dropdown-backdrop" id="dropdownBackdrop"></div>

  <!-- Main Content Container -->
  <main class="page-container" id="profiles">
    <!-- Grid of Profile Cards -->
    <section class="profiles-grid" id="profilesGrid">
      <!-- Dynamically rendered from config.js -->
    </section>

    <!-- Clean Footer with requested copyright only -->
    <footer class="site-footer">
      <div class="footer-container">
        <p class="footer-copyright" id="footerCopyright">&copy; 2026 X Exclusive. All copyright rights reserved.</p>
      </div>
    </footer>
  </main>

  <!-- Toast Notification -->
  <div class="toast-notification" id="toastNotification">
    <span class="toast-spinner"></span>
    <span class="toast-message" id="toastMsg">Connecting...</span>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
