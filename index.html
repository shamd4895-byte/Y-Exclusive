<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X Exclusive</title>
  
  <!-- SEO & Social Sharing Tags -->
  <meta name="description" content="X Exclusive - Connect, Call & Chat with verified profiles worldwide.">
  <meta name="theme-color" content="#0d0408">
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting effect -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <!-- Header Bar -->
  <header class="site-header" id="mainHeader">
    <div class="header-container">
      
      <!-- Logo Branding -->
      <a href="#" class="brand-logo" id="logoLink">
        <div class="logo-icon-wrapper">
          <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 6L20 22L13 34H6L17 17L7 6Z" fill="url(#logo_grad_1)"/>
            <path d="M33 6L20 22L27 34H34L23 17L33 6Z" fill="url(#logo_grad_2)"/>
            <defs>
              <linearGradient id="logo_grad_1" x1="6" y1="6" x2="20" y2="34" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8a2be2"/>
                <stop offset="0.5" stop-color="#ff007f"/>
                <stop offset="1" stop-color="#ff3366"/>
              </linearGradient>
              <linearGradient id="logo_grad_2" x1="34" y1="6" x2="20" y2="34" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b82f6"/>
                <stop offset="0.5" stop-color="#a855f7"/>
                <stop offset="1" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">X Exclusive</span>
      </a>

      <!-- Header Controls: Online Badge + Menu + Language -->
      <div class="header-actions">
        <!-- Live Online Counter Badge -->
        <div class="online-status-badge" id="onlineBadge">
          <span class="status-pulse-dot"></span>
          <span class="online-number" id="onlineCountText">056</span>
          <span class="online-label" id="onlineLabel">Online</span>
        </div>

        <!-- Hamburger Menu Button -->
        <button class="icon-btn menu-toggle-btn" id="menuToggleBtn" aria-label="Toggle Navigation Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Language Selector Button -->
        <button class="icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Change Language">
          <!-- Translation / Globe Icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h7M9 3v2c0 5-3 9-6 11M5 9c2 2 4 4 6 5M12 20l5-12 5 12M14 16h6"/>
          </svg>
          <span class="current-lang-code" id="currentLangCode">EN</span>
        </button>
      </div>

    </div>

    <!-- Dropdown: Navigation Menu -->
    <nav class="nav-dropdown" id="navDropdown" aria-hidden="true">
      <ul class="nav-links-list">
        <li class="nav-item">
          <a href="#" class="nav-link active" id="navHome">Home</a>
        </li>
        <li class="nav-divider"></li>
        <li class="nav-item">
          <a href="#profiles" class="nav-link" id="navProfiles">Profiles</a>
        </li>
      </ul>
    </nav>

    <!-- Dropdown: Language Picker -->
    <div class="lang-dropdown" id="langDropdown" aria-hidden="true">
      <div class="lang-option active" data-lang="en" id="langOptEn">
        <span class="lang-name-primary">English</span>
        <span class="lang-name-native">English</span>
      </div>
      <div class="lang-option" data-lang="ja" id="langOptJa">
        <span class="lang-name-primary">日本語</span>
        <span class="lang-name-native">日本語</span>
      </div>
      <div class="lang-option" data-lang="id" id="langOptId">
        <span class="lang-name-primary">Indonesia</span>
        <span class="lang-name-native">Bahasa Indonesia</span>
      </div>
      <div class="lang-option" data-lang="fil" id="langOptFil">
        <span class="lang-name-primary">Philippines</span>
        <span class="lang-name-native">Filipino</span>
      </div>
    </div>
  </header>

  <!-- Backdrop for open dropdowns -->
  <div class="dropdown-backdrop" id="dropdownBackdrop"></div>

  <!-- Main Content Container -->
  <main class="page-container" id="profiles">
    <!-- Grid of Profile Cards -->
    <section class="profiles-grid" id="profilesGrid">
      <!-- Profile cards will be dynamically rendered from config.js -->
    </section>
  </main>

  <!-- Toast Notification when Call/Chat is clicked -->
  <div class="toast-notification" id="toastNotification">
    <span class="toast-spinner"></span>
    <span class="toast-message" id="toastMsg">Connecting to WhatsApp...</span>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
