<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S Exclusive</title>
  
  <meta name="description" content="Discover verified elite profiles, connect and chat on WhatsApp in a luxury private network.">
  <meta name="theme-color" content="#f5f6fb">
  
  <!-- Cache Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=20260928_v7">
  <link rel="icon" type="image/webp" href="images/logo.webp?v=20260928_v7">
</head>
<body>
  <div id="clp-app">
    <div class="clp-wrap">
      
      <!-- Top Navigation Bar -->
      <header class="clp-nav">
        <!-- Brand Logo & Name -->
        <a class="clp-brand" href="#">
          <img class="clp-logo" src="images/logo.webp?v=20260928_v5" alt="S Exclusive" width="42" height="42">
          <span class="clp-brand-name">S Exclusive</span>
        </a>

        <!-- Header Actions: Online Badge + Menu + Language -->
        <div class="clp-actions">
          <!-- 50+ Girls Online Here Badge -->
          <div class="clp-online" id="onlineBadge" aria-label="50+ Girls Online Here">
            <span class="clp-dot"></span>
            <span class="clp-online-text">50+ Girls Online Here<b id="onlineWaSub">WhatsApp 👇</b></span>
          </div>

          <!-- Hamburger Menu Button -->
          <button class="clp-iconbtn" type="button" id="menuToggleBtn" aria-label="Menu">☰</button>

          <!-- Language Selector -->
          <div class="clp-lang-wrap" id="langWrap">
            <button class="clp-lang" type="button" id="langBtn" aria-label="Language" aria-expanded="false">
              <span>文</span>&nbsp;<strong id="currentLangDisplay">EN</strong>
            </button>

            <!-- Language Dropdown with all 12 Languages -->
            <div class="clp-lang-menu" id="langMenu" hidden>
              <a href="#" data-lang="en" class="active"><span>EN</span><small>English</small></a>
              <a href="#" data-lang="pt"><span>PT</span><small>Português</small></a>
              <a href="#" data-lang="es"><span>ES</span><small>Español</small></a>
              <a href="#" data-lang="it"><span>IT</span><small>Italiano</small></a>
              <a href="#" data-lang="fr"><span>FR</span><small>Français</small></a>
              <a href="#" data-lang="de"><span>DE</span><small>Deutsch</small></a>
              <a href="#" data-lang="da"><span>DA</span><small>Dansk</small></a>
              <a href="#" data-lang="cs"><span>CS</span><small>Čeština</small></a>
              <a href="#" data-lang="ja"><span>JA</span><small>日本語</small></a>
              <a href="#" data-lang="id"><span>ID</span><small>Bahasa Indonesia</small></a>
              <a href="#" data-lang="fil"><span>FIL</span><small>Filipino</small></a>
              <a href="#" data-lang="hi"><span>HI</span><small>हिन्दी</small></a>
            </div>
          </div>
        </div>
      </header>

      <!-- Navigation Dropdown Menu -->
      <nav class="clp-nav-dropdown" id="navDropdown" hidden>
        <a href="#" class="active">Home</a>
        <a href="#profiles">Profiles</a>
        <a href="#">VIP Network</a>
      </nav>

      <!-- Profiles Grid -->
      <section class="clp-grid" id="clp-grid">
        <!-- Dynamically rendered from config.js -->
      </section>

      <!-- Clean Copyright Footer -->
      <footer class="clp-footer">
        <p class="clp-copyright" id="footerCopyright">&copy; 2026 S Exclusive. All copyright rights reserved.</p>
      </footer>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="clp-toast" id="toastNotification">
    <span class="clp-toast-spinner"></span>
    <span id="toastMsg">Opening WhatsApp...</span>
  </div>

  <script src="config.js?v=20260928_v7"></script>
  <script src="app.js?v=20260928_v7"></script>
</body>
</html>
